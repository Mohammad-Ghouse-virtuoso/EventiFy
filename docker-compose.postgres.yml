version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: eventify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: samrat
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: eventify
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samrat"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
    driver: local
