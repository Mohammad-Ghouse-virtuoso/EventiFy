<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventiFy Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 14px;
        }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .summary-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-left: 4px solid #667eea;
        }
        
        .summary-card h3 {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .summary-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #333;
        }
        
        .events-section {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .section-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            font-size: 18px;
            font-weight: 600;
        }
        
        .events-container {
            max-height: 600px;
            overflow-y: auto;
        }
        
        .event-card {
            border-bottom: 1px solid #eee;
            padding: 20px;
            transition: background 0.3s;
        }
        
        .event-card:hover {
            background: #f9f9f9;
        }
        
        .event-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .event-meta {
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
        }
        
        .event-location {
            display: inline-block;
            background: #f0f0f0;
            padding: 4px 8px;
            border-radius: 4px;
            margin-right: 10px;
        }
        
        .rsvp-stats {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            margin: 15px 0;
        }
        
        .stat {
            text-align: center;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 6px;
            font-size: 12px;
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin: 5px 0;
        }
        
        .stat-label {
            color: #666;
            text-transform: uppercase;
            font-size: 10px;
        }
        
        .going { color: #10b981; }
        .maybe { color: #f59e0b; }
        .not-going { color: #ef4444; }
        .approved { color: #0ea5e9; }
        .checked-in { color: #8b5cf6; }
        
        .attendees-toggle {
            cursor: pointer;
            padding: 8px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 10px;
            transition: background 0.3s;
        }
        
        .attendees-toggle:hover {
            background: #764ba2;
        }
        
        .attendees-list {
            display: none;
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 6px;
        }
        
        .attendees-list.show {
            display: block;
        }
        
        .attendee-item {
            display: grid;
            grid-template-columns: 2fr 2fr 1fr 1fr;
            gap: 10px;
            padding: 8px;
            font-size: 12px;
            border-bottom: 1px solid #eee;
            align-items: center;
        }
        
        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-weight: 600;
            font-size: 11px;
        }
        
        .status-going { background: #d1fae5; color: #065f46; }
        .status-maybe { background: #fef3c7; color: #92400e; }
        .status-not-going { background: #fee2e2; color: #991b1b; }
        .status-approved { background: #cffafe; color: #164e63; }
        .status-checked-in { background: #e9d5ff; color: #5b21b6; }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        
        .users-section {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            margin-top: 30px;
        }
        
        .users-container {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .user-item {
            display: grid;
            grid-template-columns: 1fr 2fr 1.5fr;
            gap: 15px;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            align-items: center;
            font-size: 13px;
        }
        
        .user-name {
            font-weight: 600;
            color: #333;
        }
        
        .role-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .role-admin { background: #fee2e2; color: #991b1b; }
        .role-organizer { background: #dbeafe; color: #1e40af; }
        .role-attendee { background: #dcfce7; color: #166534; }
        
        @media (max-width: 768px) {
            .rsvp-stats {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .attendee-item {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 EventiFy Admin Dashboard</h1>
            <p id="refresh-time">Last updated: --:--:--</p>
            <button style="margin-top: 15px; padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;" onclick="loadDashboard()">🔄 Refresh Data</button>
        </div>
        
        <div id="error-container"></div>
        
        <div class="summary-grid" id="summary-grid">
            <div class="summary-card">
                <h3>📅 Total Events</h3>
                <div class="value" id="total-events">--</div>
            </div>
            <div class="summary-card" style="border-left-color: #10b981;">
                <h3>👥 Total Users</h3>
                <div class="value" id="total-users">--</div>
            </div>
            <div class="summary-card" style="border-left-color: #f59e0b;">
                <h3>✅ Total RSVPs</h3>
                <div class="value" id="total-rsvps">--</div>
            </div>
            <div class="summary-card" style="border-left-color: #0ea5e9;">
                <h3>🔴 Active Events</h3>
                <div class="value" id="active-events">--</div>
            </div>
        </div>
        
        <div class="events-section">
            <div class="section-header">📋 Events & Attendance</div>
            <div class="events-container" id="events-container">
                <div class="loading">Loading events...</div>
            </div>
        </div>
        
        <div class="users-section">
            <div class="section-header">👤 All Users</div>
            <div class="users-container" id="users-container">
                <div class="loading">Loading users...</div>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:8000/api/v1';
        
        async function loadDashboard() {
            try {
                document.getElementById('error-container').innerHTML = '';
                
                // Get admin token (requires login first)
                const token = localStorage.getItem('admin_token');
                
                const response = await fetch(`${API_URL}/events/admin/dashboard-stats`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.status === 401) {
                    showError('⚠️ Not authenticated. Please login as admin first.');
                    return;
                }
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                renderDashboard(data);
                document.getElementById('refresh-time').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
            } catch (error) {
                showError(`❌ Error loading dashboard: ${error.message}`);
                console.error(error);
            }
        }
        
        function showError(message) {
            document.getElementById('error-container').innerHTML = `<div class="error">${message}</div>`;
        }
        
        function renderDashboard(data) {
            const summary = data.summary;
            document.getElementById('total-events').textContent = summary.total_events;
            document.getElementById('total-users').textContent = summary.total_users;
            document.getElementById('total-rsvps').textContent = summary.total_rsvps;
            document.getElementById('active-events').textContent = summary.active_events;
            
            // Render events
            const eventsHtml = data.events.map(event => `
                <div class="event-card">
                    <div class="event-title">${event.title}</div>
                    <div class="event-meta">
                        <span class="event-location">📍 ${event.location}</span>
                        <span>${new Date(event.event_start).toLocaleDateString()}</span>
                        ${event.is_active ? '🔵' : '⚫'}
                    </div>
                    <div style="font-size: 12px; color: #666; margin-bottom: 12px;">
                        <strong>Organizer:</strong> ${event.organizer ? event.organizer.name + ' (' + event.organizer.email + ')' : 'N/A'}
                    </div>
                    <div class="rsvp-stats">
                        <div class="stat">
                            <div class="stat-label">Going</div>
                            <div class="stat-value going">${event.rsvp_statistics.going}</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Maybe</div>
                            <div class="stat-value maybe">${event.rsvp_statistics.maybe}</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Not Going</div>
                            <div class="stat-value not-going">${event.rsvp_statistics.not_going}</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Approved</div>
                            <div class="stat-value approved">${event.rsvp_statistics.approved}</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Confirmed</div>
                            <div class="stat-value">${event.rsvp_statistics.confirmed_attendees}</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Attendance</div>
                            <div class="stat-value checked-in">${event.rsvp_statistics.attendance_rate}%</div>
                        </div>
                    </div>
                    <button class="attendees-toggle" onclick="toggleAttendees(this)">👥 Show Attendees (${event.attendees.length})</button>
                    <div class="attendees-list">
                        <div style="display: grid; grid-template-columns: 2fr 2fr 1fr 1fr; gap: 10px; padding: 8px 0; border-bottom: 2px solid #ddd; font-weight: 600; font-size: 11px;">
                            <div>Name</div>
                            <div>Email</div>
                            <div>Status</div>
                            <div>Checked In</div>
                        </div>
                        ${event.attendees.map(att => `
                            <div class="attendee-item">
                                <div>${att.name}</div>
                                <div style="font-size: 11px;">${att.email}</div>
                                <div><span class="status-badge status-${att.rsvp_status}">${att.rsvp_status.replace('_', ' ')}</span></div>
                                <div>${att.checked_in ? '✅ ' + new Date(att.checked_in_at).toLocaleTimeString() : '❌'}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
            
            document.getElementById('events-container').innerHTML = eventsHtml || '<div class="loading">No events found</div>';
            
            // Render users
            const usersHtml = data.all_users.map(user => `
                <div class="user-item">
                    <div>
                        <div class="user-name">${user.name}</div>
                        <div style="color: #666; font-size: 12px;">${user.email}</div>
                    </div>
                    <div><span class="role-badge role-${user.role.toLowerCase()}">${user.role}</span></div>
                    <div style="color: #666;">${user.is_active ? '🟢 Active' : '🔴 Inactive'}</div>
                </div>
            `).join('');
            
            document.getElementById('users-container').innerHTML = usersHtml || '<div class="loading">No users found</div>';
        }
        
        function toggleAttendees(button) {
            const list = button.nextElementSibling;
            list.classList.toggle('show');
            button.textContent = button.textContent.includes('Show') ? '👥 Hide Attendees' : '👥 Show Attendees';
        }
        
        // Load on page load
        window.addEventListener('load', () => {
            // For demo: use hardcoded token or prompt for login
            const token = prompt('Enter admin token (or leave empty for demo):');
            if (token) {
                localStorage.setItem('admin_token', token);
            }
            loadDashboard();
        });
    </script>
</body>
</html>
