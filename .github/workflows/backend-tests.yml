name: Backend Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Environment setup
        run: |
          echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          echo "DATABASE_URL=sqlite:///./eventify.db" >> $GITHUB_ENV
          echo "SECRET_KEY=ci-dev-secret" >> $GITHUB_ENV
          echo "REFRESH_SECRET_KEY=ci-dev-refresh" >> $GITHUB_ENV

      # Run migrations to create schema from scratch on CI
      # Avoid 'stamp head' which marks migrations applied without actually running them

      - name: Reset SQLite database (fresh CI run)
        run: |
          rm -f eventify.db eventify.db-shm eventify.db-wal || true

      - name: Run migrations (upgrade head)
        run: |
          echo "Running Alembic migrations..."
          python -m alembic upgrade head
          echo "Migrations complete. Checking DB..."
          python -c "import sqlite3; print('Tables:', sqlite3.connect('eventify.db').execute('SELECT name FROM sqlite_master WHERE type=\"table\"').fetchall())"

      - name: Backend tests
        run: |
          echo "Running pytest..."
          pytest -v --tb=short

      - name: SQLite health
        run: |
          python - <<'PY'
          import sqlite3, os
          # CI runs with working-directory: backend, so DB is ./eventify.db
          db = os.path.join(os.getcwd(), 'eventify.db')
          conn = sqlite3.connect(db)
          conn.execute('select count(*) from event')
          conn.execute('select count(*) from user')
          conn.close()
          print('SQLite schema OK')
          PY