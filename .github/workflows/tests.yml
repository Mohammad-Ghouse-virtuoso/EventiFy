name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: eventify_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: eventify_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run unit tests
        run: |
          cd backend
          ENVIRONMENT=test python -m pytest tests/unit/ -v -m unit --cov=app --cov-report=term-missing
        env:
          DATABASE_URL: sqlite:///./test.db
      
      - name: Run integration tests
        run: |
          cd backend
          ENVIRONMENT=test python -m pytest tests/integration/ -v -m integration --cov=app --cov-append --cov-report=term-missing
        env:
          DATABASE_URL: postgresql://eventify_test:test_password@localhost:5432/eventify_test_db
          SECRET_KEY: test-secret-key-for-ci-cd-pipeline-123456789
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          LOGIN_RATE_LIMIT_PER_MINUTE: 1000
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./backend/.coverage
          flags: backend
          name: backend-coverage
        continue-on-error: true

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install frontend dependencies
        run: npm ci
      
      - name: Run frontend tests
        run: npm run test -- --run --coverage
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
        continue-on-error: true

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Python linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff black
      
      - name: Run Python linters
        run: |
          cd backend
          ruff check app tests --ignore E501,F401
          black --check app tests
        continue-on-error: true
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install frontend dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
        continue-on-error: true
